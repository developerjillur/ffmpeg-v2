name: Source CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    name: macOS / Python ${{ matrix.python }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ['3.9', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Source unit suite
        run: python -B -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Installed CLI and fresh-workspace MCP
        run: python -B scripts/smoke_public.py
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
  site:
    name: Static site / browser / accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Keep screenshots and browser reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-verification
          path: |
            test-results/
            playwright-report/
          retention-days: 14
