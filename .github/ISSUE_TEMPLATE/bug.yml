name: Bug report
description: Report a reproducible local workflow problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Remove tokens, private paths and media. Report vulnerabilities through Security, not here."
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Source version, macOS/hardware, FFmpeg and FFprobe versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Sanitized typed spec, commands and distributable fixture instructions
      render: text
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
      description: Include the structured error code and concise relevant events
    validations:
      required: true
